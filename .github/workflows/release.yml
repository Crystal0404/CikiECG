name: main
on:
  release:
    types: [ published ]

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: pip env
        run: pip install -r requirements.txt
      - name: build
        run: mcdreforged pack
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.mcdr